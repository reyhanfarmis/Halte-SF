<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F55B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Halte SF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
/* Layout: one-column phone app — sticky header, list of stop cards, fixed bottom tab bar, bottom sheet for details */
:root{
  --hue:29;
  --bg:#EDEEEC; --surface:#FFFFFF; --surface-2:#E1E5E7; --fg:#14212B; --muted:#56626B; --rule:#D3D8DA;
  --navy:#123247; --navy-2:#1C4560; --fog:#EDEEEC; --gold:#E0A526;
  --acc-l:0.53; --acc-c:0.16;
  --accent:oklch(var(--acc-l) var(--acc-c) var(--hue)); --accent-soft:oklch(0.94 0.04 var(--hue)); --on-accent:#FFFFFF;
  --live:#14874D; --warn:#B26A00; --bad:#BF3328; --spot:#D2551B;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1B26; --surface:#14293A; --surface-2:#1D3A50; --fg:#F4F1EA; --muted:#9FB0BC; --rule:#24435A; --navy:#081520; --navy-2:#14293A; --fog:#0C1B26;
  --acc-l:0.70; --accent-soft:oklch(0.32 0.07 var(--hue)); --on-accent:#0C1B26;
  --live:#3BD488; --warn:#F0AE48; --bad:#F2695D; --spot:#FF8A4C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1B26; --surface:#14293A; --surface-2:#1D3A50; --fg:#F4F1EA; --muted:#9FB0BC; --rule:#24435A; --navy:#081520; --navy-2:#14293A; --fog:#0C1B26;
  --acc-l:0.70; --accent-soft:oklch(0.32 0.07 var(--hue)); --on-accent:#0C1B26;
  --live:#3BD488; --warn:#F0AE48; --bad:#F2695D; --spot:#FF8A4C; color-scheme:dark }
:root[data-theme="light"]{ color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#F4F1EA;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font:700 17px/1 var(--f-display);letter-spacing:.2em;color:#F07A5E}
.brand .mark{width:18px;height:18px;border-radius:5px;background:var(--accent);align-self:center;position:relative}
.brand .mark::after{content:"";position:absolute;inset:4px 7px;background:var(--on-accent);border-radius:2px}
.brand small{color:#B9C6CF;font-size:12px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.live{background:color-mix(in oklab,var(--live) 18%,transparent);color:var(--live)}
.updated{font-size:12px;color:#B9C6CF;font-variant-numeric:tabular-nums;white-space:nowrap}

main{padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.h{font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 2px 0}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note b{color:var(--fg)}

.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.iconbtn{height:44px;min-width:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;padding:0 12px;font-weight:600;font-size:14px;gap:6px;grid-auto-flow:column}
.iconbtn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--rule)}
.results{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.results:empty{display:none}
.res{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);text-align:left}
.res:last-child{border-bottom:0}
.res span{color:var(--muted);font-size:13px;white-space:nowrap}

.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;width:100%;text-align:left}
.card-h .nm{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.25}
.card-h .dist{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--accent)}
.empty{padding:6px 14px 14px;color:var(--muted);font-size:14px}

.dep{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--rule);width:100%;text-align:left}
.badge{--lc:#3A4A57;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--lc);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--f-display);letter-spacing:.01em}
.badge.rail{border-radius:50%;width:34px;padding:0}
.badge.bart{border-radius:6px;font-family:var(--f-body);font-size:15px}
.badge.cable{border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.badge.sm{min-width:26px;height:26px;font-size:15px}
.badge.sm.rail{width:26px}
.dest{font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.occ{display:inline-flex;align-items:center;gap:3px}
.occ i{width:4px;height:9px;border-radius:1px;background:var(--rule);display:inline-block}
.occ i.on{background:var(--muted)}
.occ.full i.on{background:var(--bad)}
.eta{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.eta .big{display:flex;align-items:baseline;gap:3px}
.eta b{font:600 26px/1 var(--f-num)}
.eta small{font-size:12px;color:var(--muted)}
.eta .rt b{color:var(--accent)}
.eta .next{font-size:12px;color:var(--muted);margin-top:2px}
.pulse{width:10px;height:10px;align-self:flex-start;margin-top:2px}
@media (prefers-reduced-motion:no-preference){ .pulse path{animation:p 1.6s ease-in-out infinite} .pulse path:nth-child(2){animation-delay:.25s} }
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.sched{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bell{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.bell[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.dep.withbell{grid-template-columns:auto 1fr auto auto}

.linelist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow .t{flex:1;min-width:0;font-weight:600}
.lrow .m{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.alert{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--warn)}
.alert h3{margin:0;font-size:15.5px;line-height:1.3;text-wrap:balance}
.alert p{margin:0;color:var(--muted);font-size:14px}
.alert .ls{display:flex;gap:6px;flex-wrap:wrap}

.set{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.set label,.set .lbl{font-weight:600}
.set .hint{font-size:13px;color:var(--muted);margin-top:-6px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;background:oklch(var(--acc-l) var(--acc-c) var(--h));border:3px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
select{height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);padding:0 10px;font:inherit}
.feat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.feat span:nth-child(even){color:var(--live);font-weight:600}
.danger{color:var(--bad);font-weight:600;text-align:left}
.credit{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}

.scrim{position:fixed;inset:0;background:rgba(5,10,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} }
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px}
.sheet-h h2{margin:0;font:700 26px/1.05 var(--f-display);flex:1;min-width:0;text-wrap:balance}
.sheet-h .meta{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--f-body);font-weight:400}
.sheet-b{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}

.route{background:var(--surface);border-radius:var(--r);padding:8px 0}
.rs{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:44px;position:relative}
.rs .track{position:absolute;left:21px;top:0;bottom:0;width:4px;background:var(--lc)}
.rs:first-child .track{top:50%}
.rs:last-child .track{bottom:50%}
.rs .node{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--lc);justify-self:center;position:relative;z-index:1}
.rs .rn{padding-right:10px;font-size:14.5px;min-width:0}
.rs.end .rn{font-weight:700}
.veh{display:flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;font-weight:700;color:var(--fg);background:var(--accent-soft);padding:4px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.veh svg{width:14px;height:14px;color:var(--accent)}

/* --- map (core Leaflet CSS, rewritten with tokens) --- */
.mapwrap{position:relative;isolation:isolate;height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:340px;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
#map{position:absolute;inset:0;z-index:0;background:var(--surface-2)}
.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6)}
.notiles #map{background-color:var(--surface-2);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:48px 48px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font:inherit}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){ .leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)} }
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.leaflet-bar a{display:block;width:38px;height:38px;text-align:center;text-decoration:none;color:var(--fg);background:var(--surface);border-bottom:1px solid var(--rule);font:500 22px/38px var(--f-body)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a.leaflet-disabled{color:var(--muted);opacity:.5}
.leaflet-control-attribution{background:color-mix(in oklab,var(--surface) 80%,transparent);color:var(--muted);font-size:10px;padding:1px 6px;border-top-left-radius:6px}
.leaflet-control-attribution a{color:var(--muted)}
.maplibregl-map{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;font:inherit}
.maplibregl-canvas-container,.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas{outline:none}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-canvas-container.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate{touch-action:pan-x pan-y}
.maplibregl-canvas-container.maplibregl-touch-drag-pan.maplibregl-touch-zoom-rotate{touch-action:none}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{position:absolute;pointer-events:none;z-index:2}
.maplibregl-ctrl-top-left{top:0;left:0}.maplibregl-ctrl-top-right{top:0;right:0}.maplibregl-ctrl-bottom-left{bottom:0;left:0}.maplibregl-ctrl-bottom-right{bottom:0;right:0}
.maplibregl-ctrl{pointer-events:auto;clear:both}
.maplibregl-ctrl-top-left .maplibregl-ctrl{margin:10px 0 0 10px;float:left}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl,.maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0;float:right}
.maplibregl-ctrl-group{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.maplibregl-ctrl-group button{display:block;width:38px;height:38px;border:0;border-bottom:1px solid var(--rule);background:var(--surface);color:var(--fg);cursor:pointer;padding:0;position:relative}
.maplibregl-ctrl-group button:last-child{border-bottom:0}
.maplibregl-ctrl-icon{display:block}
.maplibregl-ctrl-zoom-in::after{content:"+";font:500 22px/38px var(--f-body)}
.maplibregl-ctrl-zoom-out::after{content:"−";font:500 22px/38px var(--f-body)}
.maplibregl-ctrl-compass::after{content:"↑";font:600 16px/38px var(--f-body)}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{display:none}
.maplibregl-ctrl-attrib{background:color-mix(in oklab,var(--surface) 82%,transparent);color:var(--muted);font-size:10px;padding:1px 6px;border-top-left-radius:6px}
.maplibregl-ctrl-attrib a{color:var(--muted);text-decoration:none}
.maplibregl-ctrl-attrib-button{display:none}
.pin{display:block;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.fav{background:var(--warn)}
.pin.focus{width:24px;height:24px;margin:-3px;box-shadow:0 0 0 6px color-mix(in oklab,var(--accent) 30%,transparent),0 1px 4px rgba(0,0,0,.4)}
.plabel{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--fg);padding:5px 9px;border-radius:8px;font:600 12.5px/1.2 var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.me{display:block;width:18px;height:18px;border-radius:50%;background:#1F6FE0;border:3px solid #fff;box-shadow:0 0 0 7px rgba(31,111,224,.22)}
.vdot{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--lc);color:#fff;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vdot svg{width:12px;height:12px}
.maptop{position:absolute;top:10px;left:58px;right:10px;z-index:1001;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.maptop>*{pointer-events:auto}
.mapmsg{background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.18);max-width:100%}
.mapline{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:4px 4px 4px 4px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-weight:600;font-size:13px}
.mapline button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.maploc{position:absolute;right:10px;bottom:24px;z-index:1001;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bus{position:relative;display:grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:7px;background:var(--lc);color:#fff;font:700 13px/1 var(--f-display);letter-spacing:.02em;border:2px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.45);white-space:nowrap}
.bus.rail{border-radius:11px}
.bus.bart{border-radius:5px}
.bus.cable{border-radius:3px}
.bus.sel{transform:scale(1.3);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 45%,transparent),0 2px 8px rgba(0,0,0,.45)}
.vb{position:absolute;inset:-9px;pointer-events:none}

function demoArrivals(stopId){
  const st = DEMO_STOPS.find(s => s.id === stopId); if (!st) return [];
  const nowS = Math.floor(Date.now()/1000), out = [];
  for (const [l, d] of st.serves){
    const L = DEMO_LINES.find(x=>x[0]===l), hw = headway({code:l, mode:L[2]})*60;
    const h = hash(stopId+l+d); let first = (h % hw) - (nowS % hw); if (first < -30) first += hw;
    const cycle = Math.floor((nowS + hw - first) / hw);
    for (let i=0;i<3;i++){
      const k = hash(l+d+(cycle+i)), slip = (k % 120) - 50;
      out.push({ line:l, dest:L[3][d], dir:d, eta:new Date((nowS + first + i*hw + (i?slip:0))*1000).toISOString(),
        rt: i===0 || k%4!==0, vehicle:`${l}-${1000 + (k%900)}`, occ:['seatsAvailable','seatsAvailable','standingAvailable','full'][k%4] });
    }
  }
  return out.sort((a,b)=>new Date(a.eta)-new Date(b.eta));
}
function demoLine(id){
  const L = DEMO_LINES.find(x=>x[0]===id), seq = PATTERNS[id] || [];
  const hw = headway({code:id, mode:L[2]}), segMin = L[2]==='rail' ? 2.2 : 2.8, n = Math.max(2, Math.ceil(seq.length/3));
  const dirs = [{dir:'OB', name:L[3].OB, stops:seq.map(n=>({id:n,name:n}))}, {dir:'IB', name:L[3].IB, stops:[...seq].reverse().map(n=>({id:n,name:n}))}];
  const vehicles = [];
  for (const d of dirs){
    const t = Date.now() / (hw*60000) + (d.dir==='IB' ? .5 : 0);
    for (let k=0;k<n;k++){
      const p = ((t + k/n) % 1) * (seq.length - 1), next = Math.min(seq.length-1, Math.ceil(p + 0.001));
      vehicles.push({line:id, dir:d.dir, vehicle:`${id}-${1100+k}`, nextStop:d.stops[next].id, eta:new Date(Date.now() + (next-p)*segMin*60000).toISOString()});
    }
  }
  return {directions:dirs, vehicles};
}

const PHYS = {
  g: 9.81,
  crr: 0.02,          // rolling resistance, 99a urethane on SF asphalt (smooth concrete ≈ 0.012, rough chipseal ≈ 0.03)
  rho: 1.2,           // air density at sea level, kg/m³
  cda: {stand:0.55, tuck:0.35}, // drag area: relaxed standing rider vs low tuck, m²
  windAtRider: 0.6,   // wind measured at 10 m is ~60% as strong at body height between SF buildings
  pushMs: 3.0,        // pushing pace on the flat, ≈ 6.7 mph
  remountMs: 1.5,     // below this you're pushing or walking, not rolling
};
const toblerKmh = slope => 6 * Math.exp(-3.5 * Math.abs(slope + 0.05)); // hiking pace for a given slope (rise/run)
function bearingDeg(a, b){
  const r = x => x*Math.PI/180, y = Math.sin(r(b[1]-a[1]))*Math.cos(r(b[0])),

  return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
}
function pathBearingAt(path, d){ // direction of travel at distance d along the route
  let acc = 0;

    const seg = dist({lat:path[k-1][0], lon:path[k-1][1]}, {lat:path[k][0], lon:path[k][1]});
    if (acc + seg >= d || k === path.length-1) return bearingDeg(path[k-1], path[k]);
    acc += seg;
  }

function simulateRide(r, wind, o){

  const P = r.profile, path = r.path || [];
  const windMs = (wind?.speed || 0) * PHYS.windAtRider;
  let v = 0, t = 0, top = 0, walkedM = 0, pushedM = 0, walkT = 0;
  for (let k = 1; k < P.length; k++){
    const ds = P[k].d - P[k-1].d; if (ds <= 0) continue;
    const slope = (P[k].e - P[k-1].e) / ds, th = Math.atan(slope);
    const travel = path.length > 1 ? pathBearingAt(path, (P[k].d + P[k-1].d)/2) : 0;
    const head = wind ? windMs * Math.cos((wind.from - travel) * Math.PI/180) : 0; // + = headwind
    for (let x = 0; x < ds; x += 1){
      const dx = Math.min(1, ds - x);
      const va = v + head;
      const a = -PHYS.g*Math.sin(th) - PHYS.crr*PHYS.g*Math.cos(th) - 0.5*PHYS.rho*cda*va*Math.abs(va)/m;

      if (nv > vmax) nv = vmax;                       // rider scrubs speed to stay under their limit
      if (nv < PHYS.remountMs){
        if (slope > 0.03){ const w = toblerKmh(slope)/3.6; t += dx/w; walkT += dx/w; walkedM += dx; nv = 0; } // walk the climb
        else { t += dx/PHYS.pushMs; pushedM += dx; nv = PHYS.pushMs; }                                      // push on the flat
      } else t += dx / ((v + nv)/2 || nv);

function walkBackUp(r){ // Tobler hiking time from the finish back to the start along the same street
  let t = 0; const P = r.profile;
  for (let k = P.length-1; k > 0; k--){ const ds = P[k].d - P[k-1].d; if (ds <= 0) continue; const slope = (P[k-1].e - P[k].e)/ds; t += ds / (toblerKmh(slope)/3.6); }

  if (S.sheet && (S.sheet.type==='spot' || S.sheet.type==='hill')) renderSheet();
}
async function loadSpots(){
  loadHills(); loadCommunity();
  if (S.mode === 'demo'){ S.spots = DEMO_SPOTS; return; }
  const c = store.get('spots', null);
  if (c && Date.now() - c.t < 86400000){ S.spots = c.spots; }
  else { try { const sp = await api('spots', {}, 30000); S.spots = sp; store.set('spots', {t:Date.now(), spots:sp}); } catch {} }
  if (S.tab==='spots'){ renderDyn(); drawSpots(); }
}
const allSpots = () => [...S.community.spots.map(x=>({...x, community:true, mine:S.mine.has(x.id)})), ...S.mySpots.map(x=>({...x, mine:true, local:true})), ...S.spots];
const spotById = id => allSpots().find(x=>x.id===id);
function nearestStop(p){ let b=null; for (const s of S.stops){ const d = dist(p, s); if (!b || d < b.d) b = {...s, d}; } return b; }
function kindLabel(sp){
  if (sp.community) return `<span class="kind${sp.mine?' mine':''}"><i></i>${sp.mine?'Added by you':'Community spot'}${sp.type?' · '+esc(sp.type):''}</span>`;
  if (sp.local) return `<span class="kind mine"><i></i>Only on this phone${sp.type?' · '+esc(sp.type):''}</span>`;
  return `<span class="kind"><i></i>Skatepark</span>`;
}
const walkMins = m => Math.max(1, Math.round(m*1.3/80));

function nearStops(){
  const ref = S.browse.near || S.here;
  const all = S.stops.map(s => ({...s, d:dist(ref, s)})).sort((a,b)=>a.d-b.d);
  const within = all.filter(s => s.d <= S.set.range).slice(0, 40);
  return within.length ? within : all.slice(0, 6);
}
function watchedIds(){
  const ids = new Set(nearStops().map(s=>s.id)); S.fav.forEach(f=>ids.add(f.id));
  if (S.sheet?.type==='stop') ids.add(S.sheet.id); return [...ids];
}
async function refreshArrivals(){
  const ids = watchedIds();
  if (S.mode === 'demo'){ ids.forEach(id => S.arr[id] = demoArrivals(id)); S.updated = new Date(); }
  else {
    try { const r = await api('arrivals', {stops:ids.join(',')}); Object.assign(S.arr, r.stops); S.updated = new Date(r.updated); }
    catch(e){ toast('Couldn’t load the latest times. Trying again shortly.'); }
  }
  renderDyn(); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet();
}

/* ================= RENDER: pieces ================= */
const OCC = {seatsAvailable:['Seats available',1], standingAvailable:['Standing room',2], full:['Full',3]};
function occ(o){ const v = OCC[o]; if (!v) return ''; return `<span class="occ${v[1]===3?' full':''}" title="${v[0]}">${[1,2,3].map(i=>`<i class="${i<=v[1]?'on':''}"></i>`).join('')} ${v[0]}</span>`; }

function groups(list){
  const m = new Map();
  for (const a of list || []){ if (etaMin(a.eta) < 0) continue; const k = a.line+'|'+a.dest;
    if (!m.has(k)) m.set(k, {line:a.line, dest:a.dest, dir:a.dir, items:[]}); m.get(k).items.push(a); }
  return [...m.values()].sort((a,b)=>new Date(a.items[0].eta)-new Date(b.items[0].eta));
}
function depRow(stop, g, withBell){
  const L = lineInfo(g.line), a = g.items[0], m = etaMin(a.eta);
  const next = g.items.slice(1,3).map(x=>Math.max(0,etaMin(x.eta)));
  const key = `${stop.id}|${g.line}|${g.dest}|${a.eta}`, on = S.rem.some(r=>r.key===key);
  const track = a.vehicle ? ` data-track="${esc(a.vehicle)}" data-tline="${esc(g.line)}" data-tdir="${esc(a.dir||'')}"` : '';
  return `<div class="dep${withBell?' withbell':''}"${track}>
    ${badge(g.line)}
    <div style="min-width:0"><div class="dest">${esc(g.dest || L.name)}</div>
      <div class="sub"><span>${esc(L.name)}</span>${occ(a.occ)}</div></div>
    <div class="eta"><div class="big ${a.rt?'rt':''}">${a.rt?ICON.pulse:''}<b>${m<=0?'Now':m}</b>${m>0?'<small>min</small>':''}</div>
      ${a.rt?'':'<span class="sched">scheduled</span>'}
      ${next.length?`<span class="next">then ${next.join(', ')} min</span>`:''}</div>
    ${withBell?`<button class="bell" aria-pressed="${on}" aria-label="Remind me" data-bell="${esc(key)}" data-name="${esc(stop.name)}" data-line="${esc(L.code)}" data-dest="${esc(g.dest)}" data-eta="${esc(a.eta)}">${ICON.bell}</button>`:''}
  </div>`;
}
function stopCard(s, max=4, keys=null){
  const gs = groups(S.arr[s.id]).filter(g => !keys || keys.has(g.line+'|'+g.dest)), fav = S.fav.some(f=>f.id===s.id);
  return `<article class="card">
    <div style="display:flex;align-items:center;padding-right:8px">
      <button class="card-h" data-open-stop="${esc(s.id)}"><span class="nm">${esc(s.name)}</span>${s.d!=null?`<span class="dist">${fmtAway(s.d, 'near')}</span>`:''}</button>
      <button class="star" data-fav="${esc(s.id)}" aria-pressed="${fav}" aria-label="${fav?'Remove from':'Add to'} favorites">${ICON.star(fav)}</button>
    </div>
    ${S.arr[s.id] === undefined ? '<div class="empty">Loading…</div>' : gs.length ? gs.slice(0,max).map(g=>depRow(s,g,false)).join('') : '<div class="empty">No arrivals in the next 90 minutes.</div>'}
  </article>`;
}

function renderDyn(){
  const d = $('#dyn');
  for (const [u, c] of [['#updated','#srcChip'],['#updated2','#srcChip2']]){
    const ue = $(u); if (ue) ue.textContent = S.updated ? hhmm(S.updated) : '';
    const chip = $(c); if (chip){ chip.textContent = S.mode==='live' ? 'LIVE' : 'DEMO'; chip.className = 'chip' + (S.mode==='live'?' live':''); } }
  if (!d) return;
  if (S.tab==='near'){
    const fw = $('#favwrap');
    if (fw) fw.innerHTML = S.fav.length ? `<div class="h">Favorites</div>` + S.fav.map(f=>stopCard({...(S.stops.find(s=>s.id===f.id) || f), d:undefined}, 6)).join('') : '';
    const favIds = new Set(S.fav.map(f=>f.id));
    // every route once, at its closest stop within range
    const seen = new Set(), cards = [], stops = nearStops().filter(s=>!favIds.has(s.id));
    const loaded = stops.filter(s => S.arr[s.id] !== undefined);
    for (const st of loaded){
      const keys = groups(S.arr[st.id]).map(g => g.line+'|'+g.dest).filter(k => !seen.has(k));
      if (!keys.length) continue;
      keys.forEach(k => seen.add(k));
      cards.push(stopCard(st, 8, new Set(keys)));
    }
    renderPinCard();
    d.innerHTML = cards.length ? cards.join('') + `<div class="credit">${seen.size} routes within ${S.set.range>=1000?(S.set.range/1000)+' km':S.set.range+' m'} · change the range in Settings</div>`
      : loaded.length < stops.length ? stops.slice(0,6).map(s=>stopCard(s)).join('')
      : `<div class="note">No departures within ${S.set.range>=1000?(S.set.range/1000)+' km':S.set.range+' m'} in the next 90 minutes. Try a bigger range in Settings.</div>`;
  }
  else if (S.tab==='spots' && S.spotSeg==='hills'){
    const ref = S.browse.spots || S.here;
    const all = allHills().map(h => ({...h, d:dist(ref, h.start)})).sort((a,b)=>a.d-b.d);
    all.forEach(loadHillRoute);
    const shared = all.filter(h => h.community || h.local), more = all.filter(h => !h.community && !h.local);
    const hcard = h => `<article class="card"><button class="card-h" data-open-hill="${esc(h.id)}"><span class="nm">${esc(h.name)}<br>${h.r ? dhBadge(h.r) : '<span class="kind" style="color:var(--muted)">Measuring route…</span>'}${h.community?` <span class="kind${h.mine?' mine':''}"><i></i>${h.mine?'Added by you':'Community hill'}</span>`:h.local?' <span class="kind mine"><i></i>Only on this phone</span>':''}</span><span class="dist">${fmtAway(h.d, 'spots')}</span></button>
      ${h.r ? `<div class="hstats"><div><b>${h.r.grade}%</b>avg grade</div><div><b>${h.r.length} m</b>long</div><div><b>${Math.round(h.r.drop)} m</b>drop</div></div>` : ''}</article>`;
    d.innerHTML = all.length ? (shared.length ? `<div class="h">Shared by skaters · ${shared.length}</div>` + shared.map(hcard).join('') : `<div class="note">No shared hills yet. Tap <b>+ Add hill</b> to share your line.</div>`)
        + (more.length ? `<div class="h">More SF hills</div>` + more.slice(0, 30).map(hcard).join('') : '')
      : `<div class="note">Loading SF hills… this can take a few seconds the first time.</div>`;
  }
  else if (S.tab==='spots'){
    const q = S.spotQ.trim().toLowerCase();
    const list = allSpots().filter(x => !q || (x.name+' '+(x.type||'')).toLowerCase().includes(q))
      .map(x => ({...x, d:dist(S.browse.spots || S.here, x)})).sort((a,b)=>a.d-b.d).slice(0, 40);
    d.innerHTML = list.length ? list.map(sp => {
      const ns = S.stops.length ? nearestStop(sp) : null;
      return `<article class="card"><button class="card-h" data-open-spot="${esc(sp.id)}"><span class="nm">${esc(sp.name)}<br>${kindLabel(sp)}</span><span class="dist">${fmtAway(sp.d, 'spots')}</span></button>
        ${ns?`<div class="spot-sub"><span>Closest Muni stop: ${esc(ns.name)} · ${walkMins(ns.d)} min walk</span></div>`:''}</article>`;
    }).join('') : `<div class="note">${S.spots.length||S.mySpots.length ? 'No spots match that search.' : 'Loading skate spots…'} Tap <b>+ Add spot</b> to save your own street spots.</div>`;
  }
  else if (S.tab==='lines'){
    const q = ($('#lq')?.value || '').trim().toLowerCase();
    const ls = S.lines.filter(l => (S.lineFilter==='all' || l.mode===S.lineFilter) && (!q || (l.code+' '+l.name).toLowerCase().includes(q)))
      .sort((a,b)=>(a.mode===b.mode?0:a.mode==='bart'?-1:b.mode==='bart'?1:a.mode==='rail'?-1:b.mode==='rail'?1:a.mode==='cable'?-1:1) || a.code.localeCompare(b.code,'en',{numeric:true}));
    d.innerHTML = ls.length ? `<div class="linelist">${ls.map(l=>`<button class="lrow" data-open-line="${esc(l.id)}">${badge(l.id)}<span class="t">${esc(l.name)}</span><span class="m">${{rail:'Metro',bus:'Bus',cable:'Cable car',bart:'BART'}[l.mode]}</span></button>`).join('')}</div>`
      : '<div class="note">No matching routes.</div>';
  } else if (S.tab==='alerts'){
    d.innerHTML = S.alerts.length ? S.alerts.map(a=>`<article class="alert"><div class="ls">${a.lines.map(l=>badge(l,true)).join('')}</div><h3>${esc(a.title)}</h3>${a.body?`<p>${esc(a.body)}</p>`:''}</article>`).join('')
      : '<div class="note">No service alerts right now.</div>';
  }
}

    else trips = (plan.walkOnly && plan.walkOnly <= 15 ? `<div class="note">The start is about a <b>${plan.walkOnly} min walk</b> away.</div>` : '')
      + (plan.options.length ? plan.options.map(o => tripCard(o).replace('Walk '+o.alight.walk+' min to the spot', 'Walk '+o.alight.walk+' min to the start'+(h.startX?' ('+esc(h.startX)+')':''))).join('')
        : '<div class="note">No one-seat ride to the start in the next 90 minutes. For trips with a transfer, use Google Maps.</div>');
    const body = !r ? (S.hillRoutes[h.id]===null ? '<div class="note">Couldn’t measure this route right now. Try again later.</div>' : '<div class="note">Measuring the street route and elevation…</div>')
      : `<div class="card" style="padding-top:12px"><div class="hstats"><div><b>${r.grade}%</b>avg grade</div><div><b>${r.steepest}%</b>steepest</div><div><b>${Math.round(r.drop)} m</b>drop</div></div>
          <div class="route-steps">${(r.length/1000).toFixed(r.length<1000?2:1)} km along ${esc((r.streets||[]).join(' → ') || 'the street')}${r.via ? `, through ${r.via} pin${r.via>1?'s':''} along the way` : ''}.${r.climbs.length ? ' Uphill bits are shaded in the chart.' : ''}${r.swapped && h.mine ? ' Start and finish were swapped so the route runs downhill.' : ''}</div>
          ${hillChecks(r)}</div>
        ${profileSvg(r)}
        ${rideCard(h)}${hillFogNote(h)}`;
    el.innerHTML = `<div class="sheet-h"><h2>${esc(h.name)}<div class="meta">${r ? dhBadge(r)+' · ' : ''}start is ${fmtDist(dist(S.here, h.start))}</div></h2>
        <button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">
        ${body}
        <div class="sheet-actions">
          <button class="iconbtn ghost" data-map-hill="${esc(h.id)}">${ICON.loc} Show route on map</button>
          <a class="iconbtn ghost" href="${gmapsLink(h.start)}" target="_blank" rel="noopener" style="text-decoration:none">Google Maps to start</a>
          ${h.local?`<button class="iconbtn" data-share-hill="${esc(h.id)}">Share publicly</button>`:''}
          ${h.mine?`<button class="iconbtn ghost danger" data-del-hill="${esc(h.id)}">Delete</button>`:''}
          ${h.community && !h.mine?`<button class="iconbtn ghost" data-report="hill:${esc(h.id)}">Report</button>`:''}
        </div>
        <div class="h">Get to the start</div>
        ${trips}
        <div class="credit">Route follows the streets (© OpenStreetMap). Elevation every ~25 m from ${esc(r?.elevSource || 'USGS')}. Skate at your own risk.</div>
      </div>`;
  } else if (s.type==='addhill'){
    const hp = S.hillPick || {};
    el.innerHTML = `<div class="sheet-h"><h2>Add a hill<div class="meta">Public: everyone using the app will see it</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">
        <div class="field"><label for="hlName">Name</label><input id="hlName" value="${esc(hp.name||'')}" placeholder="e.g. Clipper St from Douglass" maxlength="60"></div>
        ${(hp.pts||[]).length >= 2
          ? `<div class="note">✓ ${hp.pts.length} pins set: start, ${hp.pts.length-2} along the way, finish. Saving follows the streets through every pin in order and checks the elevation every 25 m.</div>
             <button class="iconbtn" id="hlSave" style="width:100%">Find route and save</button>
             <button class="iconbtn ghost" id="hlPick" style="width:100%">Redo pins</button>`
          : `<div class="note">On the map, tap the <b>start</b> at the top, then tap points along the streets you actually ride, then the <b>finish</b>. More pins keep the route on your line. Small uphill bits are fine as long as you can walk them.</div>
             <button class="iconbtn" id="hlPick" style="width:100%">Pin the line on the map</button>`}
      </div>`;
  } else if (s.type==='terms'){
    el.innerHTML = `<div class="sheet-h"><h2>Terms & safety<div class="meta">${S.termsOk?'Accepted':'Not accepted yet'} · version ${TERMS_VERSION}</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b"><div class="terms">${TERMS_HTML}</div></div>`;
  } else if (s.type==='addspot'){
    const dr = S.spotDraft || (S.spotDraft = {name:'', type:'Ledge', note:'', lat:null, lon:null});
    el.innerHTML = `<div class="sheet-h"><h2>Add a spot<div class="meta">Public: everyone using the app will see it</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">
        <div class="field"><label for="spName">Name</label><input id="spName" value="${esc(dr.name)}" placeholder="e.g. Embarcadero ledges" maxlength="60"></div>
        <div class="field"><label for="spType">Type</label><select id="spType">${SPOT_TYPES.map(t=>`<option${t===dr.type?' selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label for="spNote">Notes</label><textarea id="spNote" placeholder="Best time to go, security, what to skate" maxlength="300">${esc(dr.note)}</textarea></div>
        <div class="field"><span class="lbl" style="font-weight:600">Location</span>
          <div class="locrow"><button class="iconbtn ghost" id="spHere">${ICON.loc} Use where I am</button><button class="iconbtn ghost" id="spPick">Pick on map</button>
          ${dr.lat!=null?`<span class="locset">✓ Location set</span>`:''}</div></div>
        <div class="note">Don’t add private property, someone’s home, or places where skating is banned. Spots reported by 3 people are hidden.</div>
        <button class="iconbtn" id="spSave" style="width:100%">Share spot</button>
      </div>`;
  } else if (s.type==='stop'){
    const st = S.stops.find(x=>x.id===s.id) || S.fav.find(x=>x.id===s.id) || {id:s.id, name:s.id};
    const fav = S.fav.some(f=>f.id===st.id), gs = groups(S.arr[st.id]);
    el.innerHTML = `<div class="sheet-h"><h2>${esc(st.name)}<div class="meta">${S.mode==='live'?`Stop #${esc(st.id)} · `:''}${st.lat?fmtDist(dist(S.here, st)):''}</div></h2>
        <button class="star" data-fav="${esc(st.id)}" aria-pressed="${fav}" aria-label="Favorite">${ICON.star(fav)}</button>
        <button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">${st.lat?`<div class="sheet-actions"><button class="iconbtn ghost" data-map-stop="${esc(st.id)}">${ICON.loc} Show on map</button></div>`:''}
      <div class="card">${S.arr[st.id]===undefined?'<div class="empty" style="padding-top:12px">Loading…</div>': gs.length ? gs.map(g=>depRow(st,g,true)).join('') : '<div class="empty" style="padding-top:12px">No arrivals in the next 90 minutes.</div>'}</div>
      <div class="note">Green times with a signal icon are tracked live. “Scheduled” means the time comes from the timetable. Tap a departure to see that vehicle on the map.</div></div>`;
  } else {
    const L = lineInfo(s.id), data = S.lineData[s.id], color = lineColor(L);
    let body;
    if (!data) body = '<div class="note">Loading route…</div>';
    else if (data.error) body = '<div class="note">This route couldn’t load. Try again in a moment.</div>';
    else {
      const d = data.directions.find(x=>x.dir===s.dir) || data.directions[0];
      const vs = data.vehicles.filter(v => !d || v.dir===d.dir || !v.dir);
      const canMap = lineCoords(s.id, d?.dir).length >= 2;
      body = `${canMap?`<div class="sheet-actions"><button class="iconbtn ghost" data-map-line="${esc(s.id)}" data-map-dir="${esc(d.dir)}">${ICON.loc} Show route on map</button></div>`:''}
        <div class="seg">${data.directions.map(x=>`<button data-dir="${esc(x.dir)}" aria-pressed="${x.dir===d?.dir}">To ${esc(x.name)}</button>`).join('')}</div>
        <div class="route" style="--lc:${color}">${(d?.stops||[]).map((st,i,a)=>{
          const here = vs.filter(v=>v.nextStop===st.id).map(v=>Math.max(0,etaMin(v.eta)));
          return `<div class="rs${i===0||i===a.length-1?' end':''}"><span class="track"></span><span class="node"></span><span class="rn">${esc(st.name)}</span>
            ${here.length?`<span class="veh">${ICON.veh}${here.map(m=>m?m+' min':'arriving').join(' · ')}</span>`:''}</div>`; }).join('')}</div>
        <div class="note">Vehicle markers show the stop each vehicle is heading to and when it gets there. ${vs.length} vehicles active in this direction.</div>`;
    }
    el.innerHTML = `<div class="sheet-h">${badge(L.id)}<h2>${esc(L.name || 'Route '+L.code)}<div class="meta">${{rail:'Muni Metro',bus:'Muni bus',cable:'Cable car',bart:'BART train'}[L.mode]}</div></h2>
      <button class="close" data-close aria-label="Close">${ICON.close}</button></div><div class="sheet-b">${body}</div>`;
  }
  const b = el.querySelector('.sheet-b'); if (b) b.scrollTop = keep;
}

/* ================= THEME ================= */
function applyTheme(){
  const r = document.documentElement;
  if (S.set.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme);
  r.style.setProperty('--hue', S.set.hue);
}
const saveSet = () => { store.set('settings', S.set); applyTheme(); };

/* ================= REMINDERS ================= */
function checkReminders(){
  const now = Date.now(), due = S.rem.filter(r => now >= r.at);
  if (!due.length) return;
  for (const r of due){
    const msg = `${r.line} to ${r.dest} arrives in about ${S.set.lead} min at ${r.name}.`;
    toast(msg); try { navigator.vibrate?.([200,100,200]); } catch{}
    try { if (window.Notification?.permission==='granted') new Notification('Halte SF', {body:msg, tag:r.key}); } catch{}
  }
  S.rem = S.rem.filter(r => now < r.at); store.set('rem', S.rem); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet();
}

      rememberMine(pub.id); S.community.hills.unshift(pub); S.myHills = S.myHills.filter(x=>x.id!==h.id); store.set('myhills', S.myHills);
      toast('Hill shared. Everyone can see it now.'); openSheet({type:'hill', id:pub.id}); renderDyn(); drawHills();
    } catch (e) { t.disabled = false; t.textContent = 'Share publicly'; toast(e.status===503 ? 'Public sharing isn’t switched on yet.' : (e.message || 'Couldn’t share.')); }

  if (ds.report){ const [kind, id] = ds.report.split(':'); if (!t.dataset.armed){ t.dataset.armed = '1'; t.textContent = 'Tap again to report'; return; }

  if (t.id==='hlSave'){

      openSheet({type:'hill', id:hill.id}); drawHills(); renderDyn();
    } catch (e) {
      t.disabled = false; t.textContent = 'Find route and save';

        try {
          const r = await api('hillroute', {pts:hp.pts.map(p=>`${p.lat},${p.lon}`).join(';')}, 90000);

      toast('Spot shared. Everyone can see it now.'); openSheet({type:'spot', id:pub.id}); renderDyn(); drawSpots();
    } catch (e) { t.disabled = false; t.textContent = 'Share publicly'; toast(e.status===503 ? 'Public sharing isn’t switched on yet.' : (e.message || 'Couldn’t share.')); }

    store.set('fav', S.fav); renderDyn(); if (S.tab==='near') drawStops(); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet(); return;

  if (ds.bell){
    const i = S.rem.findIndex(r=>r.key===ds.bell);
    if (i>=0){ S.rem.splice(i,1); toast('Reminder canceled.'); }
    else {
      const at = new Date(ds.eta).getTime() - S.set.lead*60000;
      if (at <= Date.now()){ toast(`This vehicle arrives in less than ${S.set.lead} min.`); return; }
      S.rem.push({key:ds.bell, at, name:ds.name, line:ds.line, dest:ds.dest});
      toast(`You’ll be reminded at ${hhmm(at)}.`);
      try { if (window.Notification && Notification.permission==='default') await Notification.requestPermission(); } catch{}
    }
    store.set('rem', S.rem); renderSheet(); return;
  }
  if (ds.stance){ S.set.stance = ds.stance; saveSet(); renderTab(); return; }
  if (ds.themeSet){ S.set.theme = ds.themeSet; saveSet(); renderTab(); return; }
  if (ds.hue){ S.set.hue = +ds.hue; saveSet(); renderTab(); return; }
  if (t.id==='reset'){ if (t.dataset.armed){ ['fav','rem','base','here','settings','myspots','myhills','spots','hills','hills2','hillroutes','terms','termsAt'].forEach(k=>{try{localStorage.removeItem('halte.'+k)}catch{}}); location.reload(); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to clear everything'; } return; }
  if (t.id==='locBtn'){ tapFollow(); return; }
  if (t.classList.contains('res')){ openSheet({type:'stop', id:t.dataset.stop}); return; }
});
document.addEventListener('input', e => {

    const q = e.target.value.trim().toLowerCase(), sr = $('#sr');
    if (q.length < 2){ sr.innerHTML = ''; return; }
    const hits = S.stops.filter(s=>s.name.toLowerCase().includes(q)).map(s=>({...s,d:dist(S.here,s)})).sort((a,b)=>a.d-b.d).slice(0,8);
    sr.innerHTML = hits.length ? hits.map(s=>`<button class="res" data-stop="${esc(s.id)}">${esc(s.name)}<span>${fmtDist(s.d)}</span></button>`).join('') : '<div class="res">No stops with that name.</div>';
  }
  if (e.target.id==='lq') renderDyn();
  if (e.target.id==='spq'){ S.spotQ = e.target.value; renderDyn(); }
  if (S.hillPick && e.target.id==='hlName') S.hillPick.name = e.target.value;
  if (S.spotDraft && e.target.id==='spName') S.spotDraft.name = e.target.value;
  if (S.spotDraft && e.target.id==='spNote') S.spotDraft.note = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id==='weightLb'){ const w = Math.round(+e.target.value); if (w >= 60 && w <= 400){ S.set.weightLb = w; saveSet(); toast(`Hill estimates use ${w} lb.`); } else toast('Enter a weight between 60 and 400 lb.'); }
  if (e.target.id==='maxMph'){ S.set.maxMph = +e.target.value; saveSet(); toast(`Hill estimates hold speed under ${S.set.maxMph} mph.`); } if (e.target.id==='range'){ S.set.range = +e.target.value; saveSet(); toast('Nearby range updated.'); refreshArrivals(); } if (S.spotDraft && e.target.id==='spType') S.spotDraft.type = e.target.value; if (e.target.id==='lead'){ S.set.lead = +e.target.value; saveSet(); toast(`Reminders: ${S.set.lead} min before arrival.`); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet) closeSheet(); });

/* ================= START ================= */
async function boot(){
  applyTheme(); measureTabs(); renderTab(); startWatch(false);
  try { const p = await api('ping', {}, 4000); if (p.ok) S.mode = 'live'; } catch {}
  try { await loadBase(); } catch { S.mode = 'demo'; await loadBase(); toast('The data server isn’t ready, so sample data is shown.'); }
  renderTab(); refreshArrivals(); loadFog();
  setInterval(() => { if (!document.hidden) loadFog(true); }, 15*60000);
  setInterval(refreshArrivals, S.mode==='live' ? 60000 : 30000);
  setInterval(() => { renderDyn(); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet(); checkReminders(); if (S.tab==='near' && !document.hidden) loadVehicles(); }, 15000);
  setInterval(() => { if ((S.tab==='spots' || S.tab==='near') && !document.hidden) loadCommunity(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshArrivals(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
