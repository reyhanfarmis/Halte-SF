<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F55B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Halte SF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: one-column phone app — sticky header, list of stop cards, fixed bottom tab bar, bottom sheet for details */
:root{
  --hue:228;
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#E4E9ED; --fg:#122029; --muted:#5B6C78; --rule:#D3DBE1;
  --acc-l:0.50; --acc-c:0.14;
  --accent:oklch(var(--acc-l) var(--acc-c) var(--hue)); --accent-soft:oklch(0.94 0.04 var(--hue)); --on-accent:#FFFFFF;
  --live:#14874D; --warn:#B26A00; --bad:#BF3328; --spot:#D2551B;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1318; --surface:#141E25; --surface-2:#1D2A33; --fg:#E6EDF1; --muted:#90A2AE; --rule:#283844;
  --acc-l:0.74; --accent-soft:oklch(0.30 0.06 var(--hue)); --on-accent:#0C1318;
  --live:#3BD488; --warn:#F0AE48; --bad:#F2695D; --spot:#FF8A4C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1318; --surface:#141E25; --surface-2:#1D2A33; --fg:#E6EDF1; --muted:#90A2AE; --rule:#283844;
  --acc-l:0.74; --accent-soft:oklch(0.30 0.06 var(--hue)); --on-accent:#0C1318;
  --live:#3BD488; --warn:#F0AE48; --bad:#F2695D; --spot:#FF8A4C; color-scheme:dark }
:root[data-theme="light"]{ color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font:700 26px/1 var(--f-display);letter-spacing:.01em}
.brand .mark{width:18px;height:18px;border-radius:5px;background:var(--accent);align-self:center;position:relative}
.brand .mark::after{content:"";position:absolute;inset:4px 7px;background:var(--on-accent);border-radius:2px}
.brand small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.live{background:color-mix(in oklab,var(--live) 18%,transparent);color:var(--live)}
.updated{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

main{padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.h{font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 2px 0}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note b{color:var(--fg)}

.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.iconbtn{height:44px;min-width:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;padding:0 12px;font-weight:600;font-size:14px;gap:6px;grid-auto-flow:column}
.iconbtn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--rule)}
.results{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.results:empty{display:none}
.res{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);text-align:left}
.res:last-child{border-bottom:0}
.res span{color:var(--muted);font-size:13px;white-space:nowrap}

.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;width:100%;text-align:left}
.card-h .nm{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.25}
.card-h .dist{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--accent)}
.empty{padding:6px 14px 14px;color:var(--muted);font-size:14px}

.dep{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--rule);width:100%;text-align:left}
.badge{--lc:#3A4A57;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--lc);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--f-display);letter-spacing:.01em}
.badge.rail{border-radius:50%;width:34px;padding:0}
.badge.bart{border-radius:6px;font-family:var(--f-body);font-size:15px}
.badge.cable{border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.badge.sm{min-width:26px;height:26px;font-size:15px}
.badge.sm.rail{width:26px}
.dest{font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.occ{display:inline-flex;align-items:center;gap:3px}
.occ i{width:4px;height:9px;border-radius:1px;background:var(--rule);display:inline-block}
.occ i.on{background:var(--muted)}
.occ.full i.on{background:var(--bad)}
.eta{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.eta .big{display:flex;align-items:baseline;gap:3px}
.eta b{font:700 30px/0.95 var(--f-display)}
.eta small{font-size:12px;color:var(--muted)}
.eta .rt b{color:var(--live)}
.eta .next{font-size:12px;color:var(--muted);margin-top:2px}
.pulse{width:10px;height:10px;align-self:flex-start;margin-top:2px}
@media (prefers-reduced-motion:no-preference){ .pulse path{animation:p 1.6s ease-in-out infinite} .pulse path:nth-child(2){animation-delay:.25s} }
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.sched{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bell{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.bell[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.dep.withbell{grid-template-columns:auto 1fr auto auto}

.linelist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow .t{flex:1;min-width:0;font-weight:600}
.lrow .m{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.alert{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--warn)}
.alert h3{margin:0;font-size:15.5px;line-height:1.3;text-wrap:balance}
.alert p{margin:0;color:var(--muted);font-size:14px}
.alert .ls{display:flex;gap:6px;flex-wrap:wrap}

.set{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.set label,.set .lbl{font-weight:600}
.set .hint{font-size:13px;color:var(--muted);margin-top:-6px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;background:oklch(var(--acc-l) var(--acc-c) var(--h));border:3px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
select{height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);padding:0 10px;font:inherit}
.feat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.feat span:nth-child(even){color:var(--live);font-weight:600}
.danger{color:var(--bad);font-weight:600;text-align:left}
.credit{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}

.scrim{position:fixed;inset:0;background:rgba(5,10,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} }
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px}
.sheet-h h2{margin:0;font:700 26px/1.05 var(--f-display);flex:1;min-width:0;text-wrap:balance}
.sheet-h .meta{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--f-body);font-weight:400}
.sheet-b{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}

.route{background:var(--surface);border-radius:var(--r);padding:8px 0}
.rs{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:44px;position:relative}
.rs .track{position:absolute;left:21px;top:0;bottom:0;width:4px;background:var(--lc)}
.rs:first-child .track{top:50%}
.rs:last-child .track{bottom:50%}
.rs .node{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--lc);justify-self:center;position:relative;z-index:1}
.rs .rn{padding-right:10px;font-size:14.5px;min-width:0}
.rs.end .rn{font-weight:700}
.veh{display:flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;font-weight:700;color:var(--fg);background:var(--accent-soft);padding:4px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.veh svg{width:14px;height:14px;color:var(--accent)}

/* --- map (core Leaflet CSS, rewritten with tokens) --- */
.mapwrap{position:relative;isolation:isolate;height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:340px;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
#map{position:absolute;inset:0;z-index:0;background:var(--surface-2)}
.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6)}
.notiles #map{background-color:var(--surface-2);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:48px 48px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font:inherit}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){ .leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)} }
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.leaflet-bar a{display:block;width:38px;height:38px;text-align:center;text-decoration:none;color:var(--fg);background:var(--surface);border-bottom:1px solid var(--rule);font:500 22px/38px var(--f-body)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a.leaflet-disabled{color:var(--muted);opacity:.5}
.leaflet-control-attribution{background:color-mix(in oklab,var(--surface) 80%,transparent);color:var(--muted);font-size:10px;padding:1px 6px;border-top-left-radius:6px}
.leaflet-control-attribution a{color:var(--muted)}
.pin{display:block;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.fav{background:var(--warn)}
.pin.focus{width:24px;height:24px;margin:-3px;box-shadow:0 0 0 6px color-mix(in oklab,var(--accent) 30%,transparent),0 1px 4px rgba(0,0,0,.4)}
.plabel{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--fg);padding:5px 9px;border-radius:8px;font:600 12.5px/1.2 var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.me{display:block;width:18px;height:18px;border-radius:50%;background:#1F6FE0;border:3px solid #fff;box-shadow:0 0 0 7px rgba(31,111,224,.22)}
.vdot{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--lc);color:#fff;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vdot svg{width:12px;height:12px}
.maptop{position:absolute;top:10px;left:58px;right:10px;z-index:1001;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.maptop>*{pointer-events:auto}
.mapmsg{background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.18);max-width:100%}
.mapline{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:4px 4px 4px 4px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-weight:600;font-size:13px}
.mapline button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.maploc{position:absolute;right:10px;bottom:24px;z-index:1001;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bus{position:relative;display:grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:7px;background:var(--lc);color:#fff;font:700 13px/1 var(--f-display);letter-spacing:.02em;border:2px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.45);white-space:nowrap}
.bus.rail{border-radius:11px}
.bus.bart{border-radius:5px}
.bus.cable{border-radius:3px}
.bus.sel{transform:scale(1.3);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 45%,transparent),0 2px 8px rgba(0,0,0,.45)}
.vb{position:absolute;inset:-9px;pointer-events:none}
.vb::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid var(--lc)}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border-radius:12px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.22);width:100%}
.vc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.vc-t b{color:var(--fg);font-size:14px;overflow-wrap:anywhere}
.vc-a{display:flex;gap:6px;align-items:center}
.vc-btn{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.vc-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.dep[data-track]{cursor:pointer}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:color-mix(in oklab,var(--lc) 16%,transparent);color:var(--lc)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}
.hstats div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.hstats b{display:block;font:700 22px/1.1 var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}
.dh{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in oklab,var(--live) 16%,transparent);color:var(--live)}
.dh.up{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}
.profile{background:var(--surface);border-radius:var(--r);padding:12px 14px 8px}
.profile svg{width:100%;height:auto;display:block}
.profile .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hend{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font:700 12px/1 var(--f-body);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.hend.s{background:#14874D}.hend.f{background:#13202A}
.route-steps{font-size:13.5px;color:var(--muted);padding:0 14px 12px}
.terms{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.terms h3{margin:6px 0 0;font-size:15px}
.terms p{margin:0;color:var(--fg)}
.terms .big{font:700 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.spotpin{display:block;width:20px;height:20px;border-radius:5px;transform:rotate(45deg);background:var(--spot);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.spotpin.mine{background:var(--accent)}

async function api(ep, params={}, ms=8000){
  const u = new URL('api/511', location.href); u.searchParams.set('ep', ep);
  for (const [k,v] of Object.entries(params)) u.searchParams.set(k, v);
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), ms);
  try { const r = await fetch(u, {signal:ctl.signal}); if (!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(to); }
}

function demoArrivals(stopId){
  const st = DEMO_STOPS.find(s => s.id === stopId); if (!st) return [];
  const nowS = Math.floor(Date.now()/1000), out = [];
  for (const [l, d] of st.serves){
    const L = DEMO_LINES.find(x=>x[0]===l), hw = headway({code:l, mode:L[2]})*60;
    const h = hash(stopId+l+d); let first = (h % hw) - (nowS % hw); if (first < -30) first += hw;
    const cycle = Math.floor((nowS + hw - first) / hw);
    for (let i=0;i<3;i++){
      const k = hash(l+d+(cycle+i)), slip = (k % 120) - 50;
      out.push({ line:l, dest:L[3][d], dir:d, eta:new Date((nowS + first + i*hw + (i?slip:0))*1000).toISOString(),
        rt: i===0 || k%4!==0, vehicle:`${l}-${1000 + (k%900)}`, occ:['seatsAvailable','seatsAvailable','standingAvailable','full'][k%4] });
    }
  }
  return out.sort((a,b)=>new Date(a.eta)-new Date(b.eta));
}

  const L = DEMO_LINES.find(x=>x[0]===id), seq = PATTERNS[id] || [];
  const hw = headway({code:id, mode:L[2]}), segMin = L[2]==='rail' ? 2.2 : 2.8, n = Math.max(2, Math.ceil(seq.length/3));
  const dirs = [{dir:'OB', name:L[3].OB, stops:seq.map(n=>({id:n,name:n}))}, {dir:'IB', name:L[3].IB, stops:[...seq].reverse().map(n=>({id:n,name:n}))}];
  const vehicles = [];
  for (const d of dirs){
    const t = Date.now() / (hw*60000) + (d.dir==='IB' ? .5 : 0);
    for (let k=0;k<n;k++){
      const p = ((t + k/n) % 1) * (seq.length - 1), next = Math.min(seq.length-1, Math.ceil(p + 0.001));
      vehicles.push({line:id, dir:d.dir, vehicle:`${id}-${1100+k}`, nextStop:d.stops[next].id, eta:new Date(Date.now() + (next-p)*segMin*60000).toISOString()});
    }
  }
  return {directions:dirs, vehicles};
}

async function loadBase(){
  if (S.mode === 'demo'){
    S.lines = DEMO_LINES.map(([code,name,mode]) => ({id:code, code, name, mode}));
    S.stops = DEMO_STOPS; S.alerts = DEMO_ALERTS; S.spots = DEMO_SPOTS; S.hills = DEMO_HILLS; return;
  }
  const cached = store.get('base', null);
  if (cached && Date.now() - cached.t < 86400000){ S.lines = cached.lines; S.stops = cached.stops; }
  else {
    const [lines, stops] = await Promise.all([api('lines',{},20000), api('stops',{},30000)]);
    S.lines = lines; S.stops = stops; store.set('base', {t:Date.now(), lines, stops});
  }
  loadSpots();
  api('alerts').then(a => { S.alerts = a; if (S.tab==='alerts') renderTab(); }).catch(()=>{});
}

async function loadHills(){
  if (S.mode === 'demo'){ S.hills = DEMO_HILLS; return; }
  const c = store.get('hills2', null);
  if (c && Date.now() - c.t < 7*86400000){ S.hills = c.hills; }

  if (S.tab==='spots') renderDyn(); if (S.tab==='map') drawHills();
}
S.hillRoutes = store.get('hillroutes', {});
let hillQueue = Promise.resolve();
function loadHillRoute(h){ // measured street route + elevation profile, one hill at a time
  if (S.mode==='demo' || h.mine || S.hillRoutes[h.id] || h._loading) return;
  h._loading = true;
  hillQueue = hillQueue.then(async () => {
    try { S.hillRoutes[h.id] = await api('hillroute', {a:`${h.a.lat},${h.a.lon}`, b:`${h.b.lat},${h.b.lon}`}, 60000); store.set('hillroutes', S.hillRoutes); }
    catch { S.hillRoutes[h.id] = null; }
    if (S.tab==='spots') renderDyn(); if (S.tab==='map') drawHills(); if (S.sheet?.type==='hill' && S.sheet.id===h.id) openSheet(S.sheet);
  });
}
function hillView(h){
  const r = h.route || S.hillRoutes[h.id] || null;
  const startX = r ? (r.swapped ? h.b?.cross : h.a?.cross) : h.a?.cross, finishX = r ? (r.swapped ? h.a?.cross : h.b?.cross) : h.b?.cross;
  const name = h.mine ? h.name : `${h.street}: ${startX || '?'} → ${finishX || '?'}`;
  const start = r?.start || h.a;
  return {...h, name, r, start, startX, finishX};
}
const allHills = () => [...S.myHills.map(x=>({...x, mine:true})), ...S.hills].map(hillView);
const hillById = id => allHills().find(x=>x.id===id);
function dhBadge(r){ return !r ? '' : r.downhillAll ? `<span class="dh">↘ Downhill the whole way</span>` : `<span class="dh up">↗ Climbs ${Math.round(r.climb)} m on the way</span>`; }
function profileSvg(r){
  const P = r.profile, W = 320, H = 110, pad = 6;
  const maxE = Math.max(...P.map(p=>p.e)), minE = Math.min(...P.map(p=>p.e)), span = Math.max(1, maxE-minE), len = P[P.length-1].d || 1;
  const x = d => pad + (d/len)*(W-2*pad), y = e => pad + (1-(e-minE)/span)*(H-2*pad);
  const line = P.map((p,k)=>`${k?'L':'M'}${x(p.d).toFixed(1)},${y(p.e).toFixed(1)}`).join('');
  const climbs = (r.climbs||[]).map(c=>`<rect x="${x(c.from).toFixed(1)}" y="${pad}" width="${Math.max(2,x(c.to)-x(c.from)).toFixed(1)}" height="${H-2*pad}" fill="var(--warn)" opacity=".18"/>`).join('');
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile: ${Math.round(r.drop)} metres down over ${r.length} metres">
    ${climbs}<path d="${line} L${x(len).toFixed(1)},${H-pad} L${pad},${H-pad} Z" fill="var(--accent)" opacity=".14"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(0)}" cy="${y(P[0].e)}" r="4.5" fill="#14874D"/><circle cx="${x(len)}" cy="${y(P[P.length-1].e)}" r="4.5" fill="var(--fg)"/></svg>
    <div class="cap"><span>Start ${Math.round(P[0].e)} m</span><span>${r.length} m along the street</span><span>Finish ${Math.round(P[P.length-1].e)} m</span></div></div>`;
}
async function loadSpots(){

const allSpots = () => [...S.mySpots.map(x=>({...x, mine:true})), ...S.spots];
const spotById = id => allSpots().find(x=>x.id===id);
function nearestStop(p){ let b=null; for (const s of S.stops){ const d = dist(p, s); if (!b || d < b.d) b = {...s, d}; } return b; }
function kindLabel(sp){ return sp.mine ? `<span class="kind mine"><i></i>Your spot${sp.type?' · '+esc(sp.type):''}</span>` : `<span class="kind"><i></i>Skatepark</span>`; }
const walkMins = m => Math.max(1, Math.round(m*1.3/80));

function nearStops(){
  const all = S.stops.map(s => ({...s, d:dist(S.here, s)})).sort((a,b)=>a.d-b.d);

const OCC = {seatsAvailable:['Seats available',1], standingAvailable:['Standing room',2], full:['Full',3]};
function occ(o){ const v = OCC[o]; if (!v) return ''; return `<span class="occ${v[1]===3?' full':''}" title="${v[0]}">${[1,2,3].map(i=>`<i class="${i<=v[1]?'on':''}"></i>`).join('')} ${v[0]}</span>`; }

function groups(list){
  const m = new Map();
  for (const a of list || []){ if (etaMin(a.eta) < 0) continue; const k = a.line+'|'+a.dest;
    if (!m.has(k)) m.set(k, {line:a.line, dest:a.dest, dir:a.dir, items:[]}); m.get(k).items.push(a); }
  return [...m.values()].sort((a,b)=>new Date(a.items[0].eta)-new Date(b.items[0].eta));
}
function depRow(stop, g, withBell){
  const L = lineInfo(g.line), a = g.items[0], m = etaMin(a.eta);
  const next = g.items.slice(1,3).map(x=>Math.max(0,etaMin(x.eta)));
  const key = `${stop.id}|${g.line}|${g.dest}|${a.eta}`, on = S.rem.some(r=>r.key===key);
  const track = a.vehicle ? ` data-track="${esc(a.vehicle)}" data-tline="${esc(g.line)}" data-tdir="${esc(a.dir||'')}"` : '';

      ${next.length?`<span class="next">then ${next.join(', ')} min</span>`:''}</div>
    ${withBell?`<button class="bell" aria-pressed="${on}" aria-label="Remind me" data-bell="${esc(key)}" data-name="${esc(stop.name)}" data-line="${esc(L.code)}" data-dest="${esc(g.dest)}" data-eta="${esc(a.eta)}">${ICON.bell}</button>`:''}
  </div>`;
}
function stopCard(s, max=4, keys=null){
  const gs = groups(S.arr[s.id]).filter(g => !keys || keys.has(g.line+'|'+g.dest)), fav = S.fav.some(f=>f.id===s.id);
  return `<article class="card">

      <button class="card-h" data-open-stop="${esc(s.id)}"><span class="nm">${esc(s.name)}</span>${s.d!=null?`<span class="dist">${fmtDist(s.d)}</span>`:''}</button>

}
const selVeh = () => S.mapVeh && S.vehicles.find(v=>v.vehicle===S.mapVeh.vehicle && v.line===S.mapVeh.line);
function agoText(d){ if (!d) return ''; const s = Math.max(0, Math.round((Date.now()-d)/1000)); return s < 60 ? `${s}s ago` : `${Math.round(s/60)} min ago`; }

function demoVehicles(){
  const t = Date.now()/60000, out = [];
  DEMO_STOPS.forEach((s,i) => s.serves.slice(0,2).forEach(([l,d],k) => {
    const ph = ((t/(4+k) + i*0.37) % 1) * 2*Math.PI, r = 0.0022, L_ = DEMO_LINES.find(x=>x[0]===l);
    out.push({line:l, dir:d, dest:L_[3][d], vehicle:`${l}-${1200+i*3+k}`,
      lat:s.lat + Math.sin(ph)*r, lon:s.lon + Math.cos(ph)*r*1.3, bearing:Math.round((450 - ph*180/Math.PI) % 360),
      nextStop:s.id, eta:new Date(Date.now() + ((i+k)%7+1)*60000).toISOString(), occ:['seatsAvailable','standingAvailable'][k%2]});
  }));
  return out;
}
async function loadVehicles(){
  if (S.mode==='demo'){ S.vehicles = demoVehicles(); S.vehUpdated = new Date(); }
  else { try { const r = await api('vehicles'); S.vehicles = r.vehicles || []; S.vehUpdated = new Date(r.updated); } catch {} }
  if (S.centerVeh && S.map){
    S.centerVeh = false; const v = selVeh();
    if (v && v.lat != null) S.map.setView([v.lat, v.lon], 16);
    else { const st = S.mapVeh && S.vehicles.find(x=>x.vehicle===S.mapVeh.vehicle)?.nextStop;
      toast('Live location isn’t available for this trip right now.'); }
  }
  drawVehicles(); drawLine(); mapMsg();
}

function mapMsg(){
  const top = $('#maptop'); if (!top) return;
  const parts = [];
  if (S.hillPick?.picking) parts.push(`<div class="mapmsg"><b>Tap the ${S.hillPick.a?'finish (bottom)':'start (top)'} of the hill.</b> <button class="vc-btn" data-cancel-hill style="margin-left:6px">Cancel</button></div>`);
  if (S.pickSpot) parts.push(`<div class="mapmsg"><b>Tap the map where the spot is.</b> <button class="vc-btn" data-cancel-pick style="margin-left:6px">Cancel</button></div>`);
  const v = selVeh();
  if (v){
    const L_ = lineInfo(v.line), st = stopById(v.nextStop), m = etaMin(v.eta);
    parts.push(`<div class="vcard">${badge(L_.id,true)}<div class="vc-t"><b>To ${esc(v.dest || L_.name)}</b>
      <span>Next stop: ${esc(st?.name || '—')} · ${m<=0?'now':m+' min'}</span>
      <span>${v.occ && OCC[v.occ] ? OCC[v.occ][0]+' · ' : ''}GPS ${agoText(S.vehUpdated)}</span></div>
      <div class="vc-a">${S.mapLine?.id===v.line?'':`<button class="vc-btn" data-veh-route="${esc(v.line)}" data-veh-dir="${esc(v.dir||'')}">Route</button>`}
      <button class="vc-x" data-clear-veh aria-label="Close">${ICON.close}</button></div></div>`);
  } else if (S.mapLine){ const L_ = lineInfo(S.mapLine.id);
    parts.push(`<div class="mapline">${badge(L_.id,true)}<span>${esc(L_.name)}</span><button data-clear-line aria-label="Hide route">${ICON.close}</button></div>`); }
  if ($('#mapwrap')?.classList.contains('notiles'))
    parts.push(`<div class="mapmsg">Street map can’t load in this preview. Stop and vehicle positions are still accurate, and the full street map appears in the installed version.</div>`);
  else if (S.map && S.map.getZoom() < 13 && !S.mapLine)
    parts.push(`<div class="mapmsg">Zoom in to see vehicles and stops.</div>`);
  else if (S.mode==='live' && S.map && S.map.getZoom() < 15 && !v)
    parts.push(`<div class="mapmsg">Zoom in to see stops.</div>`);
  top.innerHTML = parts.join('');
}
function initMap(){
  if (!window.L){ $('#map').innerHTML = '<div class="note" style="margin:12px">The map couldn’t load. Check your connection and open this tab again.</div>'; return; }
  const focus = S.mapFocus && stopById(S.mapFocus);
  const v0 = selVeh();
  const m = L.map('map', {zoomControl:true, attributionControl:true})
    .setView(v0?.lat!=null ? [v0.lat, v0.lon] : focus ? [focus.lat, focus.lon] : [S.here.lat, S.here.lon], v0 || focus ? 16 : 16);
  m.attributionControl.setPrefix(false);
  S.map = m;
  let fails = 0;
  $('#mapwrap')?.classList.toggle('dark-tiles', isDark());
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Data 511.org',
  }).on('tileerror', () => { if (++fails === 2){ $('#mapwrap')?.classList.add('notiles'); mapMsg(); } }).addTo(m);
  S.stopLayer = L.layerGroup().addTo(m);
  S.lineLayer = L.layerGroup().addTo(m);
  S.hillLayer = L.layerGroup().addTo(m);
  S.spotLayer = L.layerGroup().addTo(m);
  S.vehLayer = L.layerGroup().addTo(m);
  L.marker([S.here.lat, S.here.lon], {icon:L.divIcon({className:'', html:'<span class="me"></span>', iconSize:[18,18], iconAnchor:[9,9]}), interactive:false, keyboard:false}).addTo(m);
  m.on('moveend', () => { drawStops(); drawSpots(); drawHills(); drawVehicles(); });
  m.on('click', ev => {
    if (S.hillPick && S.hillPick.picking){
      const pt = {lat:+ev.latlng.lat.toFixed(6), lon:+ev.latlng.lng.toFixed(6)};
      if (!S.hillPick.a){ S.hillPick.a = pt; L.marker([pt.lat, pt.lon], {icon:L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,11], html:'<span class="hend s">S</span>'}), interactive:false}).addTo(S.hillLayer); mapMsg(); return; }
      S.hillPick.b = pt; S.hillPick.picking = false; mapMsg(); openSheet({type:'addhill'}); return;
    }
    if (S.pickSpot){ S.pickSpot = false; Object.assign(S.spotDraft, {lat:+ev.latlng.lat.toFixed(6), lon:+ev.latlng.lng.toFixed(6)}); openSheet({type:'addspot'}); mapMsg(); return; }
    if (S.mapVeh){ S.mapVeh = null; drawVehicles(); mapMsg(); }
  });
  drawLine(); drawStops(); drawSpots(); drawHills(); drawVehicles(); loadVehicles();
  if (S.mapHill){ const h = hillById(S.mapHill); if (h) m.fitBounds(L.latLngBounds(h.r?.path || [[h.a.lat,h.a.lon],[h.b.lat,h.b.lon]]), {padding:[60,60], maxZoom:18}); }
  if (S.mapSpot){ const sp = spotById(S.mapSpot); if (sp) m.setView([sp.lat, sp.lon], 16); }
}
function drawStops(){
  if (!S.map) return;
  S.stopLayer.clearLayers(); mapMsg();
  if (S.mode==='live' && S.map.getZoom() < 15) return;
  const b = S.map.getBounds().pad(0.1), c = S.map.getCenter();
  const inView = S.stops.filter(s => b.contains([s.lat, s.lon]))
    .map(s => ({s, d:(s.lat-c.lat)**2 + (s.lon-c.lng)**2})).sort((x,y)=>x.d-y.d).slice(0, 250);
  for (const {s} of inView){
    const fav = S.fav.some(f=>f.id===s.id), foc = s.id===S.mapFocus;
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({className:'', iconSize:[18,18], iconAnchor:[9,9],
        html:`<span class="pin${fav?' fav':''}${foc?' focus':''}"></span>${foc?`<span class="plabel">${esc(s.name)}</span>`:''}`}),
      title: s.name, alt: s.name, zIndexOffset: foc ? 1000 : fav ? 500 : 0,
    }).on('click', () => openSheet({type:'stop', id:s.id})).addTo(S.stopLayer);
  }
}
function drawHills(){
  if (!S.map || !S.hillLayer) return;
  if (!S.termsOk){ S.hillLayer.clearLayers(); return; }
  if (S.hillPick?.picking) return; // keep the picked point visible
  S.hillLayer.clearLayers();
  if (S.map.getZoom() < 13 && !S.mapHill) return;
  for (const h of allHills()){
    const r = h.r; if (!r && !h.a) continue;
    const foc = h.id===S.mapHill, c = r && !r.downhillAll ? '#B26A00' : '#5B3FD9';
    const path = r?.path || [[h.a.lat,h.a.lon],[h.b.lat,h.b.lon]];
    const open = ev => { L.DomEvent.stopPropagation(ev); openSheet({type:'hill', id:h.id}); };
    L.polyline(path, {color:c, weight:foc?8:6, opacity:r?.9:.4, dashArray:r?null:'6 8', lineCap:'round', lineJoin:'round'}).on('click', open).addTo(S.hillLayer);
    const end = r?.finish || h.b, st = r?.start || h.a;
    L.marker([end.lat, end.lon], {icon:L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,11], html:'<span class="hend f">F</span>'}), title:`${h.name}: finish`, zIndexOffset:1300}).on('click', open).addTo(S.hillLayer);
    L.marker([st.lat, st.lon], {icon:L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,11],
      html:`<span class="hend s">S</span>${foc && r?`<span class="plabel">Start · ${r.grade}% avg</span>`:''}`}), title:`${h.name}: start`, zIndexOffset:1400}).on('click', open).addTo(S.hillLayer);
  }
}
function drawSpots(){
  if (!S.map || !S.spotLayer) return;
  S.spotLayer.clearLayers();
  if (!S.termsOk) return;
  if (S.map.getZoom() < 12) return;
  const b = S.map.getBounds().pad(0.2);
  for (const sp of allSpots().filter(x => b.contains([x.lat, x.lon]))){
    const foc = sp.id===S.mapSpot;
    L.marker([sp.lat, sp.lon], {
      icon: L.divIcon({className:'', iconSize:[20,20], iconAnchor:[10,10],
        html:`<span class="spotpin${sp.mine?' mine':''}${foc?' focus':''}"></span>${foc?`<span class="plabel">${esc(sp.name)}</span>`:''}`}),
      title: sp.name, alt: sp.name, zIndexOffset: 1500,
    }).on('click', ev => { L.DomEvent.stopPropagation(ev); openSheet({type:'spot', id:sp.id}); }).addTo(S.spotLayer);
  }
}
function drawVehicles(){
  if (!S.map || !S.vehLayer) return;
  S.vehLayer.clearLayers();
  let list = S.vehicles.filter(v => v.lat != null);
  if (S.mapLine) list = list.filter(v => v.line===S.mapLine.id);
  else {
    if (S.map.getZoom() < 13) list = list.filter(v => S.mapVeh && v.vehicle===S.mapVeh.vehicle);
    const b = S.map.getBounds().pad(0.2); list = list.filter(v => b.contains([v.lat, v.lon]));
  }
  for (const v of list.slice(0, 400)){
    const L_ = lineInfo(v.line), sel = S.mapVeh && S.mapVeh.vehicle===v.vehicle && S.mapVeh.line===v.line;
    const arrow = v.bearing != null ? `<i class="vb" style="transform:rotate(${v.bearing}deg)"></i>` : '';
    L.marker([v.lat, v.lon], {
      icon: L.divIcon({className:'', iconSize:[32,22], iconAnchor:[16,11],
        html:`<span class="bus ${L_.mode}${sel?' sel':''}" style="--lc:${lineColor(L_)}">${arrow}${esc(L_.code)}</span>`}),
      title:`${L_.code} to ${v.dest || ''}`, alt:`Route ${L_.code} vehicle`, zIndexOffset: sel ? 3000 : 2000,
    }).on('click', ev => { L.DomEvent.stopPropagation(ev); S.mapVeh = {line:v.line, vehicle:v.vehicle}; drawVehicles(); mapMsg(); }).addTo(S.vehLayer);
  }
}
function drawLine(){
  if (!S.map || !S.lineLayer) return;
  S.lineLayer.clearLayers();
  if (!S.mapLine) return;
  const {id, dir} = S.mapLine, pts = lineCoords(id, dir), color = lineColor(lineInfo(id));
  if (pts.length < 2) return;
  L.polyline(pts.map(p=>[p.lat,p.lon]), {color, weight:6, opacity:.85, lineCap:'round', lineJoin:'round', interactive:false}).addTo(S.lineLayer);
  if (!S.vehicles.some(v => v.line===id && v.lat != null)){ // no GPS: fall back to "heading to this stop" markers
    for (const v of (S.lineData[id]?.vehicles || []).filter(v=>!v.dir || v.dir===dir)){
      const st = stopById(v.nextStop); if (!st) continue;
      L.marker([st.lat, st.lon], {icon:L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,30],
        html:`<span class="vdot" style="--lc:${color}">${ICON.veh}</span>`}), interactive:false, keyboard:false}).addTo(S.lineLayer);
    }
  }
  if (!S.mapFocus && !S.mapVeh && !S.lineFitted){ S.lineFitted = true; S.map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])), {padding:[30,30]}); }
}
async function showOnMap(opts){
  S.mapSpot = opts.spot || null; S.mapHill = opts.hill || null;
  S.mapFocus = opts.stop || null; S.mapLine = opts.line || null; S.mapVeh = opts.veh || null;
  S.centerVeh = !!opts.veh; S.lineFitted = false;
  closeSheet(); S.tab = 'map'; renderTab(); window.scrollTo(0,0);
  if (S.mapLine && !S.lineData[S.mapLine.id]){ await loadLine(S.mapLine.id); drawLine(); }
}

/* ================= SHEET ================= */
function openSheet(s){ S.sheet = s; $('#scrim').hidden = false; $('#sheet').hidden = false; renderSheet();
  if (s.type==='stop' && S.arr[s.id]===undefined) refreshArrivals();
  if (s.type==='line') loadLine(s.id);
  if (s.type==='spot'){ const sp = spotById(s.id); if (sp) loadPlan(sp); }
  if (s.type==='hill'){ const h = hillById(s.id); if (h){ loadHillRoute(h); if (!S.plans['hill:'+h.id]) loadPlan({id:'hill:'+h.id, lat:h.start.lat, lon:h.start.lon}); } } }
function closeSheet(){ S.sheet = null; $('#scrim').hidden = true; $('#sheet').hidden = true; }

async function loadLine(id){
  try { S.lineData[id] = S.mode==='demo' ? demoLine(id) : await api('line', {line:id}, 15000); }
  catch { S.lineData[id] = {error:true}; }
  if (S.sheet?.type==='line' && S.sheet.id===id){ if (!S.sheet.dir) S.sheet.dir = S.lineData[id].directions?.[0]?.dir; renderSheet(); }
}

function tripCard(o){
  const leave = Math.round((Date.parse(o.board.eta) - o.board.walk*60000 - Date.now())/60000);
  const ride = Math.max(1, Math.round((Date.parse(o.alight.eta) - Date.parse(o.board.eta))/60000));
  const W = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 2.5-7 3 3V21M8 11l3-3 3 3 3 1"/></svg>`;
  return `<div class="trip">
    <div class="trip-top">${badge(o.line)}<div class="lv">${leave<=0?'Leave now':'Leave in '+leave+' min'}<small>toward ${esc(o.dest)}</small></div>
      <div class="arr">arrive<b>${hhmm(o.arrive)}</b></div></div>
    <ol class="steps">
      <li><span>${W}</span><span>Walk ${o.board.walk} min to <b>${esc(o.board.name)}</b></span></li>
      <li><span>${ICON.veh}</span><span>Board <b>${esc(lineInfo(o.line).code)}</b> at ${hhmm(o.board.eta)} ${o.rt?'<span class="rtag">● live</span>':''}${o.occ&&OCC[o.occ]?' · '+OCC[o.occ][0]:''}</span></li>
      <li><span>${ICON.veh}</span><span>Ride ${ride} min, get off at <b>${esc(o.alight.name)}</b></span></li>
      <li><span>${W}</span><span>Walk ${o.alight.walk} min to the spot</span></li>
    </ol>
    <div class="trip-actions"><button class="iconbtn ghost" data-track="${esc(o.vehicle)}" data-tline="${esc(o.line)}" data-tdir="${esc(o.dir||'')}">Track this ${lineInfo(o.line).mode==='bus'?'bus':'train'}</button></div>
  </div>`;
}
async function loadPlan(sp){
  if (S.mode==='demo'){ S.plans[sp.id] = {demo:true}; renderSheet(); return; }
  try { S.plans[sp.id] = {...await api('plan', {from:`${S.here.lat.toFixed(5)},${S.here.lon.toFixed(5)}`, to:`${sp.lat},${sp.lon}`}, 15000), at:Date.now()}; }
  catch { S.plans[sp.id] = {error:true}; }
  if (S.sheet && (S.sheet.type==='spot' || S.sheet.type==='hill')) renderSheet();
}
function gmapsLink(sp){ return `https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lon}&travelmode=transit`; }

function renderSheet(){
  const s = S.sheet, el = $('#sheet'); if (!s) return;
  const keep = el.querySelector('.sheet-b')?.scrollTop || 0;
  if (s.type==='spot'){
    const sp = spotById(s.id); if (!sp){ closeSheet(); return; }
    const plan = S.plans[sp.id];
    let trips;
    if (!plan) trips = '<div class="note">Finding Muni options from your location…</div>';
    else if (plan.demo) trips = '<div class="note">Live trip options appear in the installed app, using the buses that are running right now.</div>';

      + (plan.options.length ? plan.options.map(tripCard).join('')
        : `<div class="note">No direct Muni ride gets you there in the next 90 minutes. Trips with a transfer: use the Google Maps link above.</div>`);
    el.innerHTML = `<div class="sheet-h"><h2>${esc(sp.name)}<div class="meta">${kindLabel(sp)} · ${fmtDist(dist(S.here, sp))}</div></h2>

      <div class="sheet-b">
        <div class="sheet-actions">
          <button class="iconbtn ghost" data-map-spot="${esc(sp.id)}">${ICON.loc} Show on map</button>
          <a class="iconbtn ghost" href="${gmapsLink(sp)}" target="_blank" rel="noopener" style="text-decoration:none">Google Maps</a>
          ${sp.mine?`<button class="iconbtn ghost danger" data-del-spot="${esc(sp.id)}">Delete</button>`:''}
        </div>
        ${sp.note?`<div class="note">${esc(sp.note)}</div>`:''}
        <div class="h">Get there by Muni or BART</div>
        ${trips}

      + (plan.options.length ? plan.options.map(o => tripCard(o).replace('Walk '+o.alight.walk+' min to the spot', 'Walk '+o.alight.walk+' min to the start'+(h.startX?' ('+esc(h.startX)+')':''))).join('')
        : '<div class="note">No one-seat ride to the start in the next 90 minutes. For trips with a transfer, use Google Maps.</div>');
    const body = !r ? (S.hillRoutes[h.id]===null ? '<div class="note">Couldn’t measure this route right now. Try again later.</div>' : '<div class="note">Measuring the street route and elevation…</div>')
      : `<div class="card" style="padding-top:12px"><div class="hstats"><div><b>${r.grade}%</b>avg grade</div><div><b>${r.steepest}%</b>steepest</div><div><b>${Math.round(r.drop)} m</b>drop</div></div>
          <div class="route-steps">${r.length} m along ${esc((r.streets||[]).join(' → ') || 'the street')}. ${r.downhillAll ? 'Every part of this route goes down or stays level.' : `This route climbs ${Math.round(r.climb)} m in ${r.climbs.length} place${r.climbs.length>1?'s':''} (shaded below). It was the most downhill street route found.`}${r.swapped && h.mine ? ' Start and finish were swapped so the route runs downhill.' : ''}</div></div>
        ${profileSvg(r)}`;
    el.innerHTML = `<div class="sheet-h"><h2>${esc(h.name)}<div class="meta">${r ? dhBadge(r)+' · ' : ''}start is ${fmtDist(dist(S.here, h.start))}</div></h2>
        <button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">

        <div class="h">Get to the start</div>

      </div>`;
  } else if (s.type==='addhill'){
    const hp = S.hillPick || {};
    el.innerHTML = `<div class="sheet-h"><h2>Add a hill<div class="meta">Saved on this phone</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">
        <div class="field"><label for="hlName">Name</label><input id="hlName" value="${esc(hp.name||'')}" placeholder="e.g. Clipper St from Douglass" maxlength="60"></div>
        <div class="note">${hp.a && hp.b ? '✓ Start and finish set. Saving finds the street route between them and checks the elevation along it.' : 'Next you’ll tap the <b>start</b> (top) and then the <b>finish</b> (bottom) on the map. The route follows the streets between them.'}</div>
        <button class="iconbtn" id="${hp.a && hp.b ? 'hlSave' : 'hlPick'}" style="width:100%">${hp.a && hp.b ? 'Find route and save' : 'Pick start and finish on the map'}</button>
      </div>`;
  } else if (s.type==='terms'){
    el.innerHTML = `<div class="sheet-h"><h2>Terms & safety<div class="meta">${S.termsOk?'Accepted':'Not accepted yet'} · version ${TERMS_VERSION}</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b"><div class="terms">${TERMS_HTML}</div></div>`;
  } else if (s.type==='addspot'){
    const dr = S.spotDraft || (S.spotDraft = {name:'', type:'Ledge', note:'', lat:null, lon:null});
    el.innerHTML = `<div class="sheet-h"><h2>Add a spot<div class="meta">Saved on this phone</div></h2><button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">
        <div class="field"><label for="spName">Name</label><input id="spName" value="${esc(dr.name)}" placeholder="e.g. Embarcadero ledges" maxlength="60"></div>
        <div class="field"><label for="spType">Type</label><select id="spType">${SPOT_TYPES.map(t=>`<option${t===dr.type?' selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label for="spNote">Notes</label><textarea id="spNote" placeholder="Best time to go, security, what to skate" maxlength="300">${esc(dr.note)}</textarea></div>
        <div class="field"><span class="lbl" style="font-weight:600">Location</span>
          <div class="locrow"><button class="iconbtn ghost" id="spHere">${ICON.loc} Use where I am</button><button class="iconbtn ghost" id="spPick">Pick on map</button>
          ${dr.lat!=null?`<span class="locset">✓ Location set</span>`:''}</div></div>
        <button class="iconbtn" id="spSave" style="width:100%">Save spot</button>
      </div>`;
  } else if (s.type==='stop'){
    const st = S.stops.find(x=>x.id===s.id) || S.fav.find(x=>x.id===s.id) || {id:s.id, name:s.id};
    const fav = S.fav.some(f=>f.id===st.id), gs = groups(S.arr[st.id]);
    el.innerHTML = `<div class="sheet-h"><h2>${esc(st.name)}<div class="meta">${S.mode==='live'?`Stop #${esc(st.id)} · `:''}${st.lat?fmtDist(dist(S.here, st)):''}</div></h2>
        <button class="star" data-fav="${esc(st.id)}" aria-pressed="${fav}" aria-label="Favorite">${ICON.star(fav)}</button>
        <button class="close" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sheet-b">${st.lat?`<div class="sheet-actions"><button class="iconbtn ghost" data-map-stop="${esc(st.id)}">${ICON.loc} Show on map</button></div>`:''}
      <div class="card">${S.arr[st.id]===undefined?'<div class="empty" style="padding-top:12px">Loading…</div>': gs.length ? gs.map(g=>depRow(st,g,true)).join('') : '<div class="empty" style="padding-top:12px">No arrivals in the next 90 minutes.</div>'}</div>
      <div class="note">Green times with a signal icon are tracked live. “Scheduled” means the time comes from the timetable. Tap a departure to see that vehicle on the map.</div></div>`;
  } else {
    const L = lineInfo(s.id), data = S.lineData[s.id], color = lineColor(L);
    let body;
    if (!data) body = '<div class="note">Loading route…</div>';
    else if (data.error) body = '<div class="note">This route couldn’t load. Try again in a moment.</div>';
    else {
      const d = data.directions.find(x=>x.dir===s.dir) || data.directions[0];
      const vs = data.vehicles.filter(v => !d || v.dir===d.dir || !v.dir);
      const canMap = lineCoords(s.id, d?.dir).length >= 2;
      body = `${canMap?`<div class="sheet-actions"><button class="iconbtn ghost" data-map-line="${esc(s.id)}" data-map-dir="${esc(d.dir)}">${ICON.loc} Show route on map</button></div>`:''}
        <div class="seg">${data.directions.map(x=>`<button data-dir="${esc(x.dir)}" aria-pressed="${x.dir===d?.dir}">To ${esc(x.name)}</button>`).join('')}</div>
        <div class="route" style="--lc:${color}">${(d?.stops||[]).map((st,i,a)=>{
          const here = vs.filter(v=>v.nextStop===st.id).map(v=>Math.max(0,etaMin(v.eta)));
          return `<div class="rs${i===0||i===a.length-1?' end':''}"><span class="track"></span><span class="node"></span><span class="rn">${esc(st.name)}</span>
            ${here.length?`<span class="veh">${ICON.veh}${here.map(m=>m?m+' min':'arriving').join(' · ')}</span>`:''}</div>`; }).join('')}</div>
        <div class="note">Vehicle markers show the stop each vehicle is heading to and when it gets there. ${vs.length} vehicles active in this direction.</div>`;
    }
    el.innerHTML = `<div class="sheet-h">${badge(L.id)}<h2>${esc(L.name || 'Route '+L.code)}<div class="meta">${{rail:'Muni Metro',bus:'Muni bus',cable:'Cable car',bart:'BART train'}[L.mode]}</div></h2>
      <button class="close" data-close aria-label="Close">${ICON.close}</button></div><div class="sheet-b">${body}</div>`;
  }
  const b = el.querySelector('.sheet-b'); if (b) b.scrollTop = keep;
}

/* ================= THEME ================= */
function applyTheme(){
  const r = document.documentElement;
  if (S.set.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme);
  r.style.setProperty('--hue', S.set.hue);
}
const saveSet = () => { store.set('settings', S.set); applyTheme(); };

/* ================= REMINDERS ================= */
function checkReminders(){
  const now = Date.now(), due = S.rem.filter(r => now >= r.at);
  if (!due.length) return;
  for (const r of due){
    const msg = `${r.line} to ${r.dest} arrives in about ${S.set.lead} min at ${r.name}.`;
    toast(msg); try { navigator.vibrate?.([200,100,200]); } catch{}
    try { if (window.Notification?.permission==='granted') new Notification('Halte SF', {body:msg, tag:r.key}); } catch{}
  }
  S.rem = S.rem.filter(r => now < r.at); store.set('rem', S.rem); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet();
}

/* ================= INTERACTION ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, .scrim, [data-track]'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab){ if (ds.tab==='map'){ S.mapFocus = null; S.mapLine = null; S.mapSpot = null; S.mapHill = null; S.pickSpot = false; if (S.hillPick) S.hillPick.picking = false; }
    S.tab = ds.tab; renderTab(); window.scrollTo(0,0); if (ds.tab!=='settings' && ds.tab!=='map') refreshArrivals(); return; }
  if (ds.mapStop){ showOnMap({stop:ds.mapStop}); return; }
  if (ds.mapLine){ showOnMap({line:{id:ds.mapLine, dir:ds.mapDir}}); return; }
  if ('clearLine' in ds){ S.mapLine = null; S.lineLayer?.clearLayers(); drawVehicles(); mapMsg(); return; }
  if (ds.track){ showOnMap({veh:{line:ds.tline, vehicle:ds.track}, line:{id:ds.tline, dir:ds.tdir}}); return; }
  if (ds.vehRoute){ S.mapLine = {id:ds.vehRoute, dir:ds.vehDir}; S.lineFitted = true; if (!S.lineData[ds.vehRoute]) await loadLine(ds.vehRoute); drawLine(); drawVehicles(); mapMsg(); return; }
  if ('clearVeh' in ds){ S.mapVeh = null; drawVehicles(); mapMsg(); return; }
  if (t.id==='mapLoc'){ S.map?.setView([S.here.lat, S.here.lon], 16); return; }
  if (t.id==='scrim' || 'close' in ds){ closeSheet(); return; }
  if (ds.openStop){ openSheet({type:'stop', id:ds.openStop}); return; }
  if (ds.seg){ S.spotSeg = ds.seg; renderTab(); return; }
  if (t.id==='termsAgree'){ if (!$('#termsChk').checked){ toast('Tick the box to confirm you’ve read the terms.'); return; }
    S.termsOk = true; store.set('terms', TERMS_VERSION); store.set('termsAt', new Date().toISOString()); renderTab(); return; }
  if (t.id==='openTerms'){ openSheet({type:'terms'}); return; }
  if (ds.openHill){ openSheet({type:'hill', id:ds.openHill}); return; }
  if (ds.mapHill){ showOnMap({hill:ds.mapHill}); return; }
  if (ds.delHill){ if (t.dataset.armed){ S.myHills = S.myHills.filter(x=>x.id!==ds.delHill); store.set('myhills', S.myHills); closeSheet(); renderDyn(); drawHills(); toast('Hill deleted.'); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; } return; }
  if (t.id==='addHill'){ S.hillPick = {name:''}; openSheet({type:'addhill'}); return; }
  if ('cancelHill' in ds){ S.hillPick = null; S.hillLayer?.clearLayers(); mapMsg(); drawHills(); return; }
  if (t.id==='hlPick'){ S.hillPick.name = $('#hlName').value; S.hillPick.picking = true; S.hillPick.a = S.hillPick.b = null;
    closeSheet(); S.mapLine = S.mapVeh = S.mapFocus = S.mapSpot = S.mapHill = null; S.tab = 'map'; renderTab(); window.scrollTo(0,0); S.hillLayer?.clearLayers(); mapMsg(); return; }
  if (t.id==='hlSave'){
    const hp = S.hillPick; hp.name = $('#hlName').value.trim();
    if (!hp.name){ toast('Give the hill a name.'); return; }
    if (S.mode==='demo'){ toast('Measuring hills needs the installed app.'); return; }
    t.textContent = 'Finding route…';
    try {
      const r = await api('hillroute', {a:`${hp.a.lat},${hp.a.lon}`, b:`${hp.b.lat},${hp.b.lon}`}, 60000);
      const hill = {id:'myh-'+Date.now(), name:hp.name, street:'', a:{...hp.a}, b:{...hp.b}, route:r};
      S.myHills.unshift(hill); store.set('myhills', S.myHills); S.hillPick = null;
      toast(r.downhillAll ? `Saved: downhill the whole way, ${r.grade}% average.` : `Saved. Heads up: the route climbs ${Math.round(r.climb)} m.`);
      openSheet({type:'hill', id:hill.id}); drawHills(); renderDyn();
    } catch { t.textContent = 'Find route and save'; toast('Couldn’t find a street route. Check that start and finish are 20 m to 3 km apart.'); }
    return;
  }
  if (ds.openSpot){ openSheet({type:'spot', id:ds.openSpot}); return; }
  if (ds.mapSpot){ showOnMap({spot:ds.mapSpot}); return; }
  if (ds.delSpot){ if (t.dataset.armed){ S.mySpots = S.mySpots.filter(x=>x.id!==ds.delSpot); store.set('myspots', S.mySpots); closeSheet(); renderDyn(); drawSpots(); toast('Spot deleted.'); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; } return; }
  if ('cancelPick' in ds){ S.pickSpot = false; mapMsg(); openSheet({type:'addspot'}); return; }
  if (t.id==='addSpot'){ S.spotDraft = null; openSheet({type:'addspot'}); return; }
  if (t.id==='spHere' || t.id==='spPick' || t.id==='spSave'){
    const dr = S.spotDraft; dr.name = $('#spName').value; dr.type = $('#spType').value; dr.note = $('#spNote').value;
    if (t.id==='spPick'){ S.pickSpot = true; closeSheet(); S.mapLine = null; S.mapVeh = null; S.mapFocus = null; S.mapSpot = null; S.tab = 'map'; renderTab(); window.scrollTo(0,0); return; }
    if (t.id==='spHere'){
      if (!navigator.geolocation){ toast('Location isn’t available on this device.'); return; }
      navigator.geolocation.getCurrentPosition(p => { dr.lat = +p.coords.latitude.toFixed(6); dr.lon = +p.coords.longitude.toFixed(6); renderSheet(); toast('Location set to where you are.'); },
        () => toast('Couldn’t get your location. Use Pick on map instead.'), {enableHighAccuracy:true, timeout:10000});
      return;
    }
    if (!dr.name.trim()){ toast('Give the spot a name.'); $('#spName').focus(); return; }
    if (dr.lat == null){ toast('Set the location first: use where you are or pick it on the map.'); return; }
    const sp = {id:'my-'+Date.now(), name:dr.name.trim(), type:dr.type, note:dr.note.trim(), lat:dr.lat, lon:dr.lon};
    S.mySpots.unshift(sp); store.set('myspots', S.mySpots); S.spotDraft = null;
    toast('Spot saved.'); openSheet({type:'spot', id:sp.id}); renderDyn(); drawSpots(); return;
  }
  if (ds.openLine){ openSheet({type:'line', id:ds.openLine}); return; }
  if (ds.dir){ S.sheet.dir = ds.dir; renderSheet(); return; }
  if (ds.lf){ S.lineFilter = ds.lf; document.querySelectorAll('[data-lf]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lf===ds.lf)); renderDyn(); return; }
  if (ds.fav){
    const i = S.fav.findIndex(f=>f.id===ds.fav);
    if (i>=0){ S.fav.splice(i,1); toast('Removed from favorites.'); }
    else { const st = S.stops.find(s=>s.id===ds.fav); S.fav.push({id:st.id, name:st.name, lat:st.lat, lon:st.lon}); toast('Saved to favorites.'); }
    store.set('fav', S.fav); renderDyn(); if (S.tab==='map') drawStops(); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet(); return;
  }
  if (ds.bell){
    const i = S.rem.findIndex(r=>r.key===ds.bell);
    if (i>=0){ S.rem.splice(i,1); toast('Reminder canceled.'); }
    else {
      const at = new Date(ds.eta).getTime() - S.set.lead*60000;
      if (at <= Date.now()){ toast(`This vehicle arrives in less than ${S.set.lead} min.`); return; }
      S.rem.push({key:ds.bell, at, name:ds.name, line:ds.line, dest:ds.dest});
      toast(`You’ll be reminded at ${hhmm(at)}.`);
      try { if (window.Notification && Notification.permission==='default') await Notification.requestPermission(); } catch{}
    }
    store.set('rem', S.rem); renderSheet(); return;
  }
  if (ds.themeSet){ S.set.theme = ds.themeSet; saveSet(); renderTab(); return; }
  if (ds.hue){ S.set.hue = +ds.hue; saveSet(); renderTab(); return; }
  if (t.id==='reset'){ if (t.dataset.armed){ ['fav','rem','base','here','settings','myspots','myhills','spots','hills','hills2','hillroutes','terms','termsAt'].forEach(k=>{try{localStorage.removeItem('halte.'+k)}catch{}}); location.reload(); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to clear everything'; } return; }
  if (t.id==='locBtn'){
    if (!navigator.geolocation){ toast('Location isn’t available on this device.'); return; }
    toast('Finding your location…');
    navigator.geolocation.getCurrentPosition(p => {
      S.here = {lat:p.coords.latitude, lon:p.coords.longitude, label:'you'}; store.set('here', S.here);
      toast('Showing stops near you.'); renderTab(); refreshArrivals();
    }, () => toast('Location permission was denied or unavailable. Staying at Union Square.'), {enableHighAccuracy:true, timeout:10000});
    return;
  }
  if (t.classList.contains('res')){ openSheet({type:'stop', id:t.dataset.stop}); return; }
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){
    const q = e.target.value.trim().toLowerCase(), sr = $('#sr');
    if (q.length < 2){ sr.innerHTML = ''; return; }
    const hits = S.stops.filter(s=>s.name.toLowerCase().includes(q)).map(s=>({...s,d:dist(S.here,s)})).sort((a,b)=>a.d-b.d).slice(0,8);
    sr.innerHTML = hits.length ? hits.map(s=>`<button class="res" data-stop="${esc(s.id)}">${esc(s.name)}<span>${fmtDist(s.d)}</span></button>`).join('') : '<div class="res">No stops with that name.</div>';
  }
  if (e.target.id==='lq') renderDyn();
  if (e.target.id==='spq'){ S.spotQ = e.target.value; renderDyn(); }
  if (S.hillPick && e.target.id==='hlName') S.hillPick.name = e.target.value;
  if (S.spotDraft && e.target.id==='spName') S.spotDraft.name = e.target.value;
  if (S.spotDraft && e.target.id==='spNote') S.spotDraft.note = e.target.value;
});
document.addEventListener('change', e => { if (e.target.id==='range'){ S.set.range = +e.target.value; saveSet(); toast('Nearby range updated.'); refreshArrivals(); } if (S.spotDraft && e.target.id==='spType') S.spotDraft.type = e.target.value; if (e.target.id==='lead'){ S.set.lead = +e.target.value; saveSet(); toast(`Reminders: ${S.set.lead} min before arrival.`); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet) closeSheet(); });

/* ================= START ================= */
async function boot(){
  applyTheme(); renderTab();
  try { const p = await api('ping', {}, 4000); if (p.ok) S.mode = 'live'; } catch {}
  try { await loadBase(); } catch { S.mode = 'demo'; await loadBase(); toast('The data server isn’t ready, so sample data is shown.'); }
  renderTab(); refreshArrivals();
  setInterval(refreshArrivals, S.mode==='live' ? 60000 : 30000);
  setInterval(() => { renderDyn(); if (S.sheet && !['addspot','addhill','terms'].includes(S.sheet.type)) renderSheet(); checkReminders(); if (S.tab==='map' && !document.hidden) loadVehicles(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshArrivals(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
